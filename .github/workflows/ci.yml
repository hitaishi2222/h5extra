name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    name: lint and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Syntax check
        run: python -m compileall -q h5x.py

      - name: Shell syntax check
        run: bash -n h5x

      # Errors only: undefined names, syntax problems. Style is left to the author.
      - name: Lint (errors only)
        run: ruff check --select=E9,F63,F7,F82 .
