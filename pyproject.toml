[project]
name = "h5extra"
version = "0.1.0"
description = "Terminal tools for listing, previewing and deleting groups and datasets inside .h5 / .hdf5 files"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["hdf5", "h5", "fzf", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "h5py>=3.15.1",
    "pyinstaller>=6.17.0",
    "typer>=0.20.0",
]
